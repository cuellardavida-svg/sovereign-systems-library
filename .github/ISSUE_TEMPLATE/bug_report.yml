name: Bug report
description: Report incorrect behavior in core tooling or domain modules.
title: "[Bug]: "
labels:
  - bug
body:
  - type: checkboxes
    id: domain
    attributes:
      label: Affected domain(s)
      options:
        - label: lineage-ledger
        - label: newsroom-engine
        - label: discipline-tracker
        - label: regenerative-sim
        - label: story-weaving
        - label: core/schemas/shared tooling
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Exact steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, traces, and provenance context
      description: Include records/sources linked to the issue.
